name: deb

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-deb:
    name: build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary and package
        run: bash packaging/build-deb.sh
      - name: Lint package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: weft-deb
          path: dist/*.deb
          if-no-files-found: error
